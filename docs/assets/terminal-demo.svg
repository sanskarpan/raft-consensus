<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
  <!-- Window frame -->
  <rect width="680" height="400" rx="12" ry="12" fill="#0d1117"/>

  <!-- Title bar -->
  <rect width="680" height="40" rx="12" ry="12" fill="#161b22"/>
  <rect y="28" width="680" height="12" fill="#161b22"/>
  <line x1="0" y1="40" x2="680" y2="40" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="6" fill="#febc2e"/>
  <circle cx="60" cy="20" r="6" fill="#28c840"/>

  <!-- Tab title -->
  <text x="340" y="25" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">bash — raft-consensus</text>

  <!-- ── put ── -->
  <text x="20" y="66" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#3fb950">$</text>
  <text x="31" y="66" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#e6edf3"> kvctl --endpoints :8002,:8004,:8006 put user/1 alice</text>

  <text x="20" y="86" font-family="'Courier New', Consolas, monospace" font-size="13">
    <tspan fill="#3fb950">OK</tspan><tspan fill="#8b949e">  revision=42</tspan>
  </text>

  <!-- ── get ── -->
  <text x="20" y="122" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#3fb950">$</text>
  <text x="31" y="122" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#e6edf3"> kvctl --endpoints :8002,:8004,:8006 get user/1</text>

  <text x="20" y="142" font-family="'Courier New', Consolas, monospace" font-size="13">
    <tspan fill="#58a6ff">user/1</tspan><tspan fill="#8b949e"> = </tspan><tspan fill="#e3b341">alice</tspan><tspan fill="#8b949e">  (rev=42, ver=1)</tspan>
  </text>

  <!-- ── status ── -->
  <text x="20" y="178" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#3fb950">$</text>
  <text x="31" y="178" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#e6edf3"> kvctl --endpoints :8002,:8004,:8006 status</text>

  <!-- node1 (leader) -->
  <circle cx="24" cy="193" r="5" fill="#3fb950"/>
  <text x="35" y="199" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#e6edf3">node1</text>
  <rect x="90" y="187" width="52" height="16" rx="3" fill="#0d2b4e"/>
  <text x="93" y="199" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#58a6ff">leader</text>
  <text x="147" y="199" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#8b949e">  term=3  commit=42  applied=42</text>

  <!-- node2 -->
  <circle cx="24" cy="213" r="5" fill="#8b949e"/>
  <text x="35" y="219" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#8b949e">node2  follower  lag=0ms</text>

  <!-- node3 -->
  <circle cx="24" cy="233" r="5" fill="#8b949e"/>
  <text x="35" y="239" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#8b949e">node3  follower  lag=1ms</text>

  <!-- ── txn ── -->
  <text x="20" y="275" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#3fb950">$</text>
  <text x="31" y="275" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#e6edf3"> kvctl --endpoints :8002,:8004,:8006 txn txn.json</text>

  <text x="20" y="295" font-family="'Courier New', Consolas, monospace" font-size="13">
    <tspan fill="#3fb950">COMMITTED</tspan><tspan fill="#8b949e">  revision=43  ops=2</tspan>
  </text>

  <!-- ── watch ── -->
  <text x="20" y="331" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#3fb950">$</text>
  <text x="31" y="331" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#e6edf3"> kvctl --endpoints :8002,:8004,:8006 watch user/ --prefix</text>

  <!-- event 1: PUT -->
  <rect x="20" y="340" width="36" height="16" rx="3" fill="#0d2b0d"/>
  <text x="22" y="352" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#3fb950">PUT</text>
  <text x="62" y="352" font-family="'Courier New', Consolas, monospace" font-size="13">
    <tspan fill="#8b949e">user/1 = </tspan><tspan fill="#e3b341">alice</tspan><tspan fill="#8b949e">    </tspan><tspan fill="#58a6ff">rev=44</tspan>
  </text>

  <!-- event 2: PUT -->
  <rect x="20" y="358" width="36" height="16" rx="3" fill="#0d2b0d"/>
  <text x="22" y="370" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#3fb950">PUT</text>
  <text x="62" y="370" font-family="'Courier New', Consolas, monospace" font-size="13">
    <tspan fill="#8b949e">user/2 = </tspan><tspan fill="#e3b341">bob</tspan><tspan fill="#8b949e">      </tspan><tspan fill="#58a6ff">rev=45</tspan>
  </text>

  <!-- event 3: DEL -->
  <rect x="20" y="376" width="36" height="16" rx="3" fill="#2d0d0d"/>
  <text x="22" y="388" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#f85149">DEL</text>
  <text x="62" y="388" font-family="'Courier New', Consolas, monospace" font-size="13">
    <tspan fill="#8b949e">user/1              </tspan><tspan fill="#58a6ff">rev=46</tspan>
  </text>
</svg>
