node_id: node3
listen_addr: :8015
http_addr: :8016
data_dir: ./data
election_tick: 50
heartbeat_tick: 1
cluster:
  - id: node1
    address: localhost:8011
    http_address: localhost:8012
  - id: node2
    address: localhost:8013
    http_address: localhost:8014
  - id: node3
    address: localhost:8015
    http_address: localhost:8016

# Transport security (M-TLS1 / M-TLS2)
# Choose ONE of the following options:
#
# Option A: Zero-config encrypted dev (self-signed cert generated in data_dir)
# auto_tls: true
#
# Option B: Production mTLS with CA-issued per-node certs
#   Generate certs first: ./scripts/gen-dev-certs.sh certs/
# tls_cert: certs/node3.crt
# tls_key: certs/node3.key
# tls_ca: certs/ca.crt
# require_tls: true
#
# Option C: Explicitly opt out of TLS (development only, not recommended)
# DANGER: enable only for local development — plaintext inter-node traffic
# insecure_transport: true
# For development with zero PKI setup, use auto_tls instead:
# auto_tls: true

# Authentication — set a strong random token before connecting to any network:
# admin_token: "change-me-to-a-random-secret"
# allow_no_auth: false  # default; never set true in production

# SPIFFE/SPIRE workload identity (cloud-native alternative to static TLS)
# Requires a SPIRE agent running on the host with socket at the configured path.
# When set, overrides tls_cert/tls_key/tls_ca.
# spiffe_socket: /run/spire/sockets/agent.sock
# spiffe_trust_domain: cluster.local
